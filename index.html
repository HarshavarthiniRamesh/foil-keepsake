<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Foil Keepsake</title>
  <meta name="description" content="Press a little message into a chocolate wrapper, and send it to someone special.">
  <meta name="theme-color" content="#f6f6f4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ibarra+Real+Nova:ital,wght@0,400;1,400&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-mode="edit">
  <main class="desk">
    <header class="intro">
      <h1>Foil Keepsake</h1>
      <p class="lede edit-only">Emboss a note for someone special.</p>
      <p class="lede view-only">Someone folded up a little something for you.</p>
    </header>

    <div class="sheet">
      <canvas id="foil" aria-label="Chocolate wrapper foil. Press and drag to press lines into it."></canvas>
      <div id="ghost" class="ghost" hidden aria-hidden="true"></div>
      <div id="reveal" class="reveal" hidden>
        <div id="fold" class="fold" data-step="0" aria-hidden="true"></div>
        <button id="open-note" class="tag" aria-label="For you. Tap to open, with sound on.">
          <svg class="tag-art" viewBox="0 0 140 100" preserveAspectRatio="none" aria-hidden="true">
            <defs>
              <filter id="tag-grain" x="0" y="0" width="100%" height="100%">
                <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="4"/>
                <feColorMatrix values="0 0 0 0 0.4 0 0 0 0 0.36 0 0 0 0 0.28 0 0 0 0.09 0"/>
                <feComposite in2="SourceGraphic" operator="in"/>
              </filter>
            </defs>
            <rect x="0" y="0" width="140" height="100" rx="1.5" fill="#fbf9f4"/>
            <rect x="0" y="0" width="140" height="100" rx="1.5" fill="#fff" filter="url(#tag-grain)"/>
            <!-- the border, its corners notched in -->
            <path class="tag-rule" d="M14 7 H126 A6 6 0 0 0 132 13 V87 A6 6 0 0 0 126 93 H14 A6 6 0 0 0 8 87 V13 A6 6 0 0 0 14 7 Z"/>
          </svg>
          <span class="tag-text">
            <span class="tag-name">For you</span>
            <span class="tag-pre">a little something</span>
            <span class="tag-cta">Tap to open</span>
          </span>
        </button>
      </div>
    </div>

    <nav class="dock edit-only" aria-label="Foil tools">
      <button class="swatch gold" data-foil="gold" aria-label="Gold foil" title="Gold foil"></button>
      <button class="swatch silver" data-foil="silver" aria-label="Silver foil" title="Silver foil"></button>
      <span class="sep" aria-hidden="true"></span>
      <button class="dbtn tip" data-tool="fine" aria-label="Fine tip" title="Fine tip"><i style="--d:4px"></i></button>
      <button class="dbtn tip" data-tool="medium" aria-label="Medium tip" title="Medium tip"><i style="--d:7px"></i></button>
      <button class="dbtn tip" data-tool="bold" aria-label="Bold tip" title="Bold tip"><i style="--d:11px"></i></button>
      <button class="dbtn" id="stamps" aria-label="Stamps" aria-expanded="false" aria-pressed="false" title="Stamps"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 13V9.8A2.5 2.5 0 0 1 12 4.5a2.5 2.5 0 0 1 2.5 5.3V13M5 13h14v3.5H5zM7 19.5h10"/></svg></button>
      <div id="tray" class="tray" hidden></div>
      <!-- on phones the dock shows only the current foil and tip; these hold the choices -->
      <div id="foil-pop" class="tray pop" hidden>
        <button class="swatch gold" data-foil="gold" aria-label="Gold foil" title="Gold foil"></button>
        <button class="swatch silver" data-foil="silver" aria-label="Silver foil" title="Silver foil"></button>
      </div>
      <div id="tip-pop" class="tray pop" hidden>
        <button class="dbtn tip" data-tool="fine" aria-label="Fine tip" title="Fine tip"><i style="--d:4px"></i></button>
        <button class="dbtn tip" data-tool="medium" aria-label="Medium tip" title="Medium tip"><i style="--d:7px"></i></button>
        <button class="dbtn tip" data-tool="bold" aria-label="Bold tip" title="Bold tip"><i style="--d:11px"></i></button>
      </div>
      <span class="sep" aria-hidden="true"></span>
      <button class="dbtn" id="undo" aria-label="Undo" title="Undo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button class="dbtn" id="clear" aria-label="Smooth it out (clear)" title="Smooth it out">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M5.5 7l1 12.5a1.5 1.5 0 0 0 1.5 1.5h8a1.5 1.5 0 0 0 1.5-1.5l1-12.5M9 7V4.5A1 1 0 0 1 10 3.5h4a1 1 0 0 1 1 1V7"/></svg>
      </button>
      <button class="dbtn" id="sound" aria-pressed="true" aria-label="Mute sound" title="Sound">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="m16 9 6 6m0-6-6 6"/></svg>
      </button>
      <button class="dbtn" id="save" aria-label="Save image" title="Save image">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 19.5h14"/></svg>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button class="pill" id="share">Share</button>
    </nav>

    <nav class="dock view-only" aria-label="Keepsake actions">
      <button class="dbtn" id="replay" aria-label="Replay" title="Replay">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.34-5.66M4 4v5h5"/></svg>
      </button>
      <button class="dbtn" id="save-view" aria-label="Save image" title="Save image">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 19.5h14"/></svg>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button class="pill" id="own">Make your own</button>
    </nav>

    <p class="hint edit-only"><span class="on-hover">Hover over the foil to tilt it into the light.</span><span class="on-touch">Tilt your phone to catch the light on it.</span></p>
    <p class="credit">By <a href="https://x.com/harshajayram" target="_blank" rel="noopener">Harsha</a></p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="unsupported" class="unsupported" hidden>
    <p>This browser can't render the foil (it needs WebGL2). Try a recent Chrome, Safari or Firefox.</p>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
